<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Treemap editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Treemap editor: show how totals are made up, with every area on one scale.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='15' height='24' rx='2.5' fill='%233F88AE'/%3E%3Crect x='20' y='4' width='9' height='11' rx='2.5' fill='%23DD5471'/%3E%3Crect x='20' y='17' width='9' height='11' rx='2.5' fill='%23D9BF7F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/treemap.css">
  <!-- Pinned third-party libraries, served from this folder (see ../shared/vendor/). -->
  <script src="../shared/vendor/d3-7.9.0.min.js"></script>
  <script src="../shared/vendor/xlsx-0.18.12.full.min.js"></script>
  <script src="../shared/vendor/js-yaml-4.1.0.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script data-goatcounter="https://dataviewers.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="no-doc">
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <aside class="panel panel-left" id="outline" aria-label="Blocks, values and carriers"></aside>
    <main class="workspace">
      <div class="canvas" id="canvas"></div>
      <section class="drawer" id="drawer" aria-label="Data, issues and log"></section>
    </main>
    <aside class="panel panel-right" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="dialogRoot"></div>
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>Drop a .xlsx, .json or .yaml file to open it</div>
  </div>
  <noscript>The treemap editor needs JavaScript.</noscript>
</body>
</html>
