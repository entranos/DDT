<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sankey editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sankey editor: make Sankey diagrams with consistent unit-to-pixel scaling.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 5h7c9 0 9 11 21 11v6C17 22 17 11 9 11H2z' fill='%233F88AE'/%3E%3Cpath d='M2 20h7c7 0 9 4 21 4v4c-12 0-14-4-21-4H2z' fill='%23DD5471'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/sankey.css">
  <!-- Pinned third-party libraries, served from this folder (see ../shared/vendor/). -->
  <script src="../shared/vendor/d3-7.9.0.min.js"></script>
  <script src="../shared/vendor/d3-collection-1.0.7.min.js"></script>
  <script src="../shared/vendor/d3-sankey-diagram-0.7.0.js"></script>
  <script src="../shared/vendor/xlsx-0.18.12.full.min.js"></script>
  <script src="../shared/vendor/js-yaml-4.1.0.min.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body class="no-doc">
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <aside class="panel panel-left" id="outline" aria-label="Nodes, flows and carriers"></aside>
    <main class="workspace">
      <div class="canvas" id="canvas"></div>
      <section class="drawer" id="drawer" aria-label="Data, issues and log"></section>
    </main>
    <aside class="panel panel-right" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="dialogRoot"></div>
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>Drop a .xlsx, .json or .yaml file to open it</div>
  </div>
  <noscript>The sankey editor needs JavaScript.</noscript>
</body>
</html>
