<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chord editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chord editor: flows between nodes around a circle, for one or more scenarios.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6.5 8A13 13 0 0 0 4 18Q16 16 22 28A13 13 0 0 0 26 24.500Q16 16 6.500 8Z' fill='%23E0A93B'/%3E%3Cpath d='M20 4A13 13 0 0 1 27 9Q16 16 11 27.500A13 13 0 0 1 7 25Q16 16 20 4Z' fill='%237862C6' fill-opacity='.85'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%234a453d' stroke-width='2.200' stroke-dasharray='20 5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/css/fonts.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/chord.css">
  <!-- Pinned third-party libraries, served from this folder (see ../shared/vendor/). -->
  <script src="../shared/vendor/d3-7.9.0.min.js"></script>
  <script src="../shared/vendor/xlsx-0.18.12.full.min.js"></script>
  <script src="../shared/vendor/js-yaml-4.1.0.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script data-goatcounter="https://dataviewers.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="no-doc">
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <aside class="panel panel-left" id="outline" aria-label="Scenarios, nodes, groups, carriers and flows"></aside>
    <main class="workspace">
      <div class="canvas" id="canvas"></div>
      <section class="drawer" id="drawer" aria-label="Data, issues and log"></section>
    </main>
    <aside class="panel panel-right" id="inspector" aria-label="Inspector"></aside>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="dialogRoot"></div>
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>Drop a .xlsx, .json or .yaml file to open it</div>
  </div>
  <noscript>The chord editor needs JavaScript.</noscript>
</body>
</html>
